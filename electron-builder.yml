appId: app.noctorink
productName: NoctorInk
copyright: Copyright © 2026 NoctorInk
asar: true
directories:
  output: dist
  buildResources: assets
files:
  - src/**/*
  - assets/**/*
  - package.json
extraMetadata:
  main: src/main/main.js
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: assets/icon.ico
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: NoctorInk
  artifactName: ${productName}-${version}-setup.${ext}
portable:
  artifactName: ${productName}-${version}-portable.${ext}
forceCodeSigning: false
